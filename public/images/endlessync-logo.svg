<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background and Glow Filters -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Main Gradients matching the Endlessync logo -->
    <linearGradient id="cyan-blue-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="blue-magenta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="magenta-pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <ellipse cx="120" cy="70" rx="90" ry="45" fill="url(#center-glow)" />

  <!-- Constellation Nodes & Connecting Web Lines in Background -->
  <g opacity="0.45" stroke="#38bdf8" stroke-width="0.8">
    <line x1="65" y1="45" x2="85" y2="70" />
    <line x1="85" y1="70" x2="120" y2="50" />
    <line x1="120" y1="50" x2="155" y2="70" />
    <line x1="155" y1="70" x2="175" y2="45" />
    <line x1="85" y1="70" x2="100" y2="95" />
    <line x1="155" y1="70" x2="140" y2="95" />
    <circle cx="65" cy="45" r="2.2" fill="#38bdf8" />
    <circle cx="85" cy="70" r="2.5" fill="#06b6d4" />
    <circle cx="120" cy="50" r="2.2" fill="#c084fc" />
    <circle cx="155" cy="70" r="2.5" fill="#f472b6" />
    <circle cx="175" cy="45" r="2.2" fill="#ec4899" />
    <circle cx="100" cy="95" r="2" fill="#60a5fa" />
    <circle cx="140" cy="95" r="2" fill="#e879f9" />
  </g>

  <!-- Infinity Symbol Loops (Cyan / Blue Left Loop) -->
  <path d="M 120 70 C 95 30, 40 30, 40 70 C 40 105, 95 105, 120 70"
        stroke="url(#cyan-blue-grad)"
        stroke-width="16"
        stroke-linecap="round"
        fill="none"
        filter="url(#neon-glow)"
        opacity="0.9" />

  <!-- Infinity Symbol Loops (Magenta / Pink Right Loop) -->
  <path d="M 120 70 C 145 110, 200 110, 200 70 C 200 35, 145 35, 120 70"
        stroke="url(#magenta-pink-grad)"
        stroke-width="16"
        stroke-linecap="round"
        fill="none"
        filter="url(#neon-glow)"
        opacity="0.9" />

  <!-- Center Dynamic 'S' Bridge with Brush Stroke Texture Intersecting -->
  <path d="M 125 32 C 145 32, 142 55, 120 70 C 98 85, 95 108, 115 108"
        stroke="url(#blue-magenta-grad)"
        stroke-width="14"
        stroke-linecap="round"
        fill="none"
        filter="url(#soft-glow)" />

  <!-- Inner High-Intensity Accent Highlights -->
  <path d="M 120 70 C 95 35, 45 38, 45 70"
        stroke="#e0f2fe"
        stroke-width="3"
        stroke-linecap="round"
        fill="none"
        opacity="0.8" />
  <path d="M 120 70 C 145 105, 195 102, 195 70"
        stroke="#fdf2f8"
        stroke-width="3"
        stroke-linecap="round"
        fill="none"
        opacity="0.8" />
  <path d="M 122 40 C 135 44, 130 58, 120 70 C 110 82, 105 96, 118 100"
        stroke="#ffffff"
        stroke-width="2.5"
        stroke-linecap="round"
        fill="none"
        opacity="0.85" />

  <!-- Dot Halftone Matrix Accents on Left & Right Curvatures -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="50" cy="85" r="1.5"/>
    <circle cx="56" cy="88" r="1.5"/>
    <circle cx="62" cy="91" r="1.5"/>
    <circle cx="53" cy="91" r="1.5"/>
    <circle cx="59" cy="94" r="1.5"/>
    <circle cx="65" cy="96" r="1.5"/>
  </g>
  <g fill="#f472b6" opacity="0.6">
    <circle cx="190" cy="55" r="1.5"/>
    <circle cx="184" cy="52" r="1.5"/>
    <circle cx="178" cy="49" r="1.5"/>
    <circle cx="187" cy="49" r="1.5"/>
    <circle cx="181" cy="46" r="1.5"/>
    <circle cx="175" cy="44" r="1.5"/>
  </g>
</svg>
