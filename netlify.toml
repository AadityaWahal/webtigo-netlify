[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "public"

[functions]
  included_files = ["views/**", "seo/**", "public/**"]
  node_bundler = "esbuild"
  external_node_modules = ["ejs", "express-ejs-layouts", "sharp", "cookie-parser"]

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"
    Cache-Control = "public, max-age=604800, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/favicon-48x48.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=604800, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/favicon-96x96.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=604800, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/favicon-192x192.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=604800, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/favicon-512x512.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=604800, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=604800, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
