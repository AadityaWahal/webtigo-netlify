[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "public"

[functions]
  included_files = ["views/**", "seo/**", "public/**"]
  node_bundler = "esbuild"
  external_node_modules = ["ejs", "express-ejs-layouts", "sharp", "cookie-parser"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
